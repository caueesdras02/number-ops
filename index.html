<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Number Ops — controle operacional de números." />
    <title>Number Ops</title>
    <link rel="stylesheet" href="./src/css/main.css" />
  </head>
  <body>
    <div id="app" class="app-shell">
      <button class="mobile-nav-overlay" type="button" data-mobile-nav-close aria-label="Fechar menu"></button>
      <aside class="sidebar" id="primary-navigation" aria-label="Navegação principal">
        <a class="brand" href="#dashboard" aria-label="Number Ops, página inicial">
          <img class="brand-logo" src="./src/assets/number-ops-logo.png" alt="Number Ops" />
          <span class="brand-copy"><strong>Number Ops</strong><small>Controle operacional</small></span>
        </a>
        <nav class="navigation" aria-label="Seções do sistema">
          <a class="navigation-link is-active" href="#dashboard" data-view="dashboard"><span class="nav-icon" aria-hidden="true">⌂</span><span>Visão geral</span></a>
          <a class="navigation-link" href="#numbers" data-view="numbers"><span class="nav-icon" aria-hidden="true">#</span><span>Números</span></a>

          <a class="navigation-link" href="#backup" data-view="backup"><span class="nav-icon" aria-hidden="true">⇅</span><span>Dados e Backup</span></a>
        </nav>
        <p class="sidebar-note">V1 · dados locais no navegador</p>
      </aside>
      <main class="main-content">
        <header class="topbar">
          <button class="mobile-menu-toggle" type="button" data-mobile-nav-toggle aria-label="Abrir menu" aria-controls="primary-navigation" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="2"/></svg></button>
          <div><p class="eyebrow">Operação</p><h1 id="page-title">Visão geral</h1></div>
          <span class="environment-label">Fundação da V1</span>
        </header>
        <section id="page-content" class="page-content" aria-live="polite"></section>
      </main>

    <div class="toast-region" aria-live="polite" aria-atomic="true"></div>

    <script type="module" src="./src/js/app.js"></script>
